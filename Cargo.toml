[package]
name = "mcp-bookstack"
version = "0.2.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
reqwest = { version = "0.13.5", features = ["json", "query"] }
rmcp = { version = "3.7.0", features = ["server", "macros", "transport-io", "schemars"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "io-std", "process"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
rmcp = { version = "3.7.0", features = ["client"] }
